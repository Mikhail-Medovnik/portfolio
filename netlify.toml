# NEXT_PUBLIC_SITE_URL must be set as a Netlify build environment variable
# before the first real deploy (Site configuration > Environment variables).
# Without it, metadataBase/canonical/OG tags/sitemap.xml/robots.txt/JSON-LD
# all fall back to the placeholder "https://example.com" baked into the
# static export at build time.
[build]
  command = "npm run build"
  publish = "out"
